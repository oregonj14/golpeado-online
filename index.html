<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Golpeado: Saloon Edition</title>
    <!-- Fuente estilo Western -->
    <link href="https://fonts.googleapis.com/css2?family=Rye&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background: linear-gradient(135deg, #3d2314 0%, #1a0f08 100%); /* Madera oscura de fondo */
            color: white; text-align: center; margin: 0; padding: 0; height: 100vh; overflow: hidden;
        }
        
        .western-title { font-family: 'Rye', cursive; color: #f1c40f; text-shadow: 2px 2px 5px black; font-size: 2.5rem; margin: 10px 0;}
        
        .container { max-width: 600px; margin: 5vh auto; background: rgba(0,0,0,0.6); padding: 25px; border-radius: 15px; border: 2px solid #8e44ad; box-shadow: 0 8px 25px rgba(0,0,0,0.8); }
        input, select, button { padding: 10px; margin: 8px 0; border: none; border-radius: 5px; font-size: 15px; font-weight: bold; }
        input, select { width: 80%; background-color: #ecf0f1; color: black; }
        button { background: linear-gradient(to bottom, #d4af37, #aa7f18); border: 2px solid #5c4000; color: #3e2700; cursor: pointer; width: 85%; transition: 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.5); }
        button:hover { filter: brightness(1.2); transform: scale(1.02); }
        .hidden { display: none !important; }

        .char-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 20px 0; }
        .char-btn { background: #5c3a21; border: 2px solid #3d2314; border-radius: 10px; padding: 8px; font-size: 24px; cursor: pointer; }
        .char-btn.my-selection { border-color: #f1c40f; background: #c0392b; box-shadow: 0 0 15px #f1c40f; }

        /* MESA TIPO GOVERNOR OF POKER */
        .board { display: flex; flex-direction: column; justify-content: space-between; height: 100vh; position: relative; }
        
        .poker-table {
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
            width: 90%; max-width: 800px; height: 50vh;
            background: radial-gradient(ellipse at center, #2e5c36 0%, #153a1d 100%);
            border: 20px solid #5c3a21; border-radius: 50%; /* Ovalada */
            box-shadow: inset 0 0 30px rgba(0,0,0,0.8), 0 15px 40px rgba(0,0,0,0.9);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 1;
        }

        .mat { display: flex; justify-content: center; gap: 30px; }
        .deck-slot { width: 65px; height: 95px; border: 2px dashed #f1c40f; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; background-color: rgba(0,0,0,0.3); color: #f1c40f; }
        
        .card { 
            width: 65px; height: 95px; background-color: white; color: black; border-radius: 6px; 
            display: flex; flex-direction: column; justify-content: space-between; padding: 4px; box-sizing: border-box; 
            font-weight: bold; box-shadow: 0 4px 8px rgba(0,0,0,0.4); cursor: grab; touch-action: none; user-select: none; transition: transform 0.1s ease; 
        }
        .card:active { cursor: grabbing; transform: scale(1.05) translateY(-5px); z-index: 10; }
        .card.selected { border: 3px solid #f1c40f; transform: translateY(-15px); background-color: #fffae6; box-shadow: 0 0 15px #f1c40f; }
        .card.hearts, .card.diamonds { color: #c0392b; }
        .card.clubs, .card.spades { color: #2c3e50; }
        .card.joker { color: #8e44ad; background: linear-gradient(135deg, #e0aaff, #fff); }

        .exposed-groups-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 15px; max-width: 80%; }
        .exposed-group { display: inline-flex; background: rgba(0,0,0,0.5); padding: 5px; border-radius: 6px; border: 1px solid #f1c40f; cursor: pointer; }
        
        /* AVATARES ALREDEDOR DE LA MESA */
        .opponents-container { position: absolute; width: 100%; height: 100%; top: 0; left: 0; pointer-events: none; z-index: 2; }
        .avatar-seat { position: absolute; display: flex; flex-direction: column; align-items: center; pointer-events: auto; }
        .avatar-icon { font-size: 35px; background: #c0392b; border: 3px solid #f1c40f; border-radius: 50%; width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; box-shadow: 0 5px 15px rgba(0,0,0,0.8); }
        .avatar-seat.active-turn .avatar-icon { background: #f1c40f; border-color: white; box-shadow: 0 0 20px #f1c40f; animation: pulse 1.5s infinite; }
        .avatar-name { background: rgba(0,0,0,0.8); padding: 2px 8px; border-radius: 10px; font-size: 11px; margin-top: -10px; border: 1px solid #5c3a21; white-space: nowrap; }
        .avatar-cards { font-size: 11px; color: #f1c40f; font-weight: bold; background: rgba(0,0,0,0.7); padding: 2px 5px; border-radius: 5px; margin-top: 2px; }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

        /* BURLA POPUP ANIMATION */
        .taunt-popup { position: absolute; top: -100px; left: 50%; transform: translateX(-50%); z-index: 100; animation: popUpTaunt 3s forwards; pointer-events: none; }
        @keyframes popUpTaunt { 0% { opacity: 0; transform: translate(-50%, 20px); } 15% { opacity: 1; transform: translate(-50%, 0); } 80% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -20px); } }

        /* PANEL INFERIOR (TU MANO) */
        .bottom-panel { position: absolute; bottom: 0; width: 100%; background: linear-gradient(to top, #1a0f08, transparent); padding-bottom: 10px; z-index: 5; display: flex; flex-direction: column; align-items: center; }
        .status-bar { display: flex; justify-content: center; gap: 10px; margin-bottom: 10px; background: rgba(0,0,0,0.8); padding: 8px; border-radius: 20px; border: 1px solid #5c3a21; width: 95%; max-width: 600px; }
        .status-bar button { margin: 0; width: auto; padding: 5px 12px; font-size: 12px; }
        .hand-container { display: flex; justify-content: center; gap: 5px; flex-wrap: wrap; padding: 10px; min-height: 105px; width: 100%; }

        /* PANEL DE CHAT SALOON */
        #chatBox { position: absolute; left: 10px; top: 10px; width: 220px; background: rgba(61, 35, 20, 0.85); border: 2px solid #5c3a21; border-radius: 8px; z-index: 10; display: flex; flex-direction: column; padding: 5px; }
        #chatMessages { flex: 1; max-height: 120px; overflow-y: auto; font-size: 11px; text-align: left; margin-bottom: 5px; color: #ecf0f1; }
        .chat-emotes { display: flex; gap: 5px; justify-content: center; }
        .emote-btn { background: #2c160b; border: 1px solid #f1c40f; border-radius: 5px; padding: 4px; font-size: 16px; cursor: pointer; }

        @media (max-width: 480px) {
            .poker-table { height: 40vh; border-width: 10px; top: 35%; }
            .card, .deck-slot { width: 55px; height: 80px; font-size: 13px; padding: 2px; }
            #chatBox { width: 160px; top: 5px; left: 5px; }
            .western-title { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <!-- LOBBY INICIAL -->
    <div class="container" id="lobby">
        <h1 class="western-title">🤠 Saloon Golpeado 🃏</h1>
        <input type="text" id="username" placeholder="Ingresa tu Nick">
        <button onclick="createRoom()">Crear Mesa</button>
        <input type="text" id="roomCode" placeholder="Código de Sala">
        <button onclick="joinRoom()">Unirse a Mesa</button>
    </div>

    <!-- SALA DE ESPERA -->
    <div class="container hidden" id="waitingRoom">
        <h2 class="western-title">Sala: <span id="displayCode" style="color:#f1c40f;">----</span></h2>
        
        <div id="hostSettingsArea" class="hidden" style="background:rgba(0,0,0,0.5); padding:10px; border-radius:10px; margin:10px 0; border: 1px solid #5c3a21;">
            <h4 style="margin:0 0 5px 0; color:#f1c40f;">⚙️ Reglas de la Mesa (Host)</h4>
            <div style="display:flex; justify-content:space-around; font-size:12px; gap: 5px;">
                <select id="setPlayers" onchange="sendSettings()"><option value="2">2 Max</option><option value="3">3 Max</option><option value="4">4 Max</option><option value="5" selected>5 Max</option></select>
                <select id="setJokers" onchange="sendSettings()"><option value="0">0 Jokers</option><option value="2" selected>2 Jokers</option><option value="4">4 Jokers</option></select>
                <select id="setStarter" onchange="sendSettings()"></select>
            </div>
        </div>

        <h4 style="color:#ecf0f1;">🎭 Elige tu sombrero:</h4>
        <div class="char-grid" id="charactersGrid"></div>

        <ul id="playerList" style="list-style:none; padding:0; font-size:14px; text-align:left; line-height:1.8;"></ul>
        
        <button id="readyBtn" onclick="toggleReady()">MARCAR LISTO</button>
        <button id="startBtn" class="hidden" onclick="startGame()" style="margin-top:10px; background: linear-gradient(#27ae60, #2ecc71);">REPARTIR CARTAS 🚀</button>
    </div>

    <!-- TABLERO GOVERNOR DE POKER -->
    <div class="board hidden" id="gameBoard">
        
        <!-- Chat Lateral -->
        <div id="chatBox">
            <div id="chatMessages"></div>
            <div class="chat-emotes">
                <button class="emote-btn" onclick="sendChat('🃏')">🃏</button>
                <button class="emote-btn" onclick="sendChat('😂')">😂</button>
                <button class="emote-btn" onclick="sendChat('😡')">😡</button>
                <button class="emote-btn" onclick="sendChat('🤠')">🤠</button>
            </div>
        </div>

        <!-- Avatares Posicionados Alrededor -->
        <div class="opponents-container" id="opponentsArea"></div>

        <!-- Mesa Central -->
        <div class="poker-table">
            <div class="mat">
                <div class="deck-slot" onclick="drawCard('deck')">MAZO<br><span id="deckCount" style="font-size:10px">0</span></div>
                <div id="discardSlot" onclick="drawCard('discard')"><div class="deck-slot">Vacío</div></div>
            </div>
            <div class="exposed-groups-container" id="exposedArea"></div>
            <span id="turnIndicator" style="position:absolute; bottom: 10px; font-family:'Rye',cursive; color:#f1c40f; text-shadow:1px 1px 2px black;">Cargando...</span>
        </div>

        <!-- Panel del Jugador Inferior -->
        <div class="bottom-panel">
            <div class="status-bar">
                <button onclick="voteKickActive()" style="background: linear-gradient(#c0392b, #900); color:white;">🚨 Expulsar</button>
                <button onclick="sendKnock()">¡GOLPE!</button>
                <button onclick="surrenderHand()">🪦 Retirarse</button>
                <button onclick="tauntCard()" style="background: linear-gradient(#8e44ad, #5e3370); color:white;">🃏 Burlar</button>
            </div>
            <div class="hand-container" id="myHand"></div>
            <p id="helperText" style="font-size: 11px; color: #f1c40f; margin: 0;"></p>
        </div>
    </div>

    <!-- MODAL VICTORIA -->
    <div class="container hidden" id="victoryModal" style="position:fixed; top:10vh; left:50%; transform:translateX(-50%); z-index:1000; width:80%;">
        <h1 class="western-title" style="color:#e74c3c;">💥 FIN DE MANO 💥</h1>
        <p style="margin:0;"><strong id="knockerName">-</strong></p>
        <h2 id="victoryAlert" style="color:#f1c40f; margin:10px 0;">Ganador</h2>
        <table style="width:100%; border-collapse:collapse; margin-bottom:15px; font-size:13px;" id="modalScoreBody"></table>
        <button onclick="returnToLobby()">Volver a la Sala</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let currentRoomId = '', myName = '', miTurno = false, currentPhase = 'draw', soyHost = false;
        let selectedCards = [];
        let miPersonaje = null;
        let draggedElement = null;

        const characterList = ['🤠', '🦊', '🦁', '🐍', '🐺', '🦅', '🦈', '🤖', '💀', '👽']; 
        const suitIcons = { hearts: '♥', diamonds: '♦', clubs: '♣', spades: '♠', none: '🃏' };

        socket.on('connect', () => { if (currentRoomId && myName) socket.emit('join_room', { roomId: currentRoomId, name: myName }); });

        function createRoom() { 
            myName = document.getElementById('username').value.trim(); 
            if (!myName) return alert('⚠️ Ingresa tu nombre.');
            socket.emit('create_room', { name: myName }); 
        }

        function joinRoom() { 
            myName = document.getElementById('username').value.trim(); 
            const c = document.getElementById('roomCode').value.trim(); 
            if (myName && c) { currentRoomId = c; socket.emit('join_room', { roomId: c, name: myName }); }
        }

        function sendSettings() {
            if(!soyHost) return;
            socket.emit('change_settings', { 
                roomId: currentRoomId, 
                maxPlayers: document.getElementById('setPlayers').value, 
                jokerCount: document.getElementById('setJokers').value, 
                startingPlayerId: document.getElementById('setStarter').value 
            });
        }

        function pickCharacter(char) { socket.emit('select_character', { roomId: currentRoomId, character: char }); }
        function toggleReady() { socket.emit('toggle_ready', currentRoomId); }
        function startGame() { socket.emit('start_game', currentRoomId); }
        function sendKnock() { socket.emit('knock', currentRoomId); }
        function returnToLobby() { socket.emit('request_back_to_lobby', currentRoomId); }
        function surrenderHand() { if (confirm("🪦 ¿Retirarse de esta ronda? (+20 pts).")) socket.emit('surrender_hand', currentRoomId); }
        function voteKickActive() { socket.emit('vote_kick_player', currentRoomId); }

        // LÓGICA DE CHAT Y BURLA
        function sendChat(msg) { socket.emit('send_chat', { roomId: currentRoomId, msg }); }
        function tauntCard() {
            if (selectedCards.length === 1) {
                socket.emit('taunt_card', { roomId: currentRoomId, cardId: selectedCards[0] });
                document.getElementById('myHand').querySelector('.selected').classList.remove('selected');
                selectedCards = [];
            } else { alert("⚠️ Selecciona solo 1 carta de tu mano para mostrarla como burla."); }
        }

        socket.on('chat_msg', ({ sender, msg, character }) => {
            const chat = document.getElementById('chatMessages');
            chat.innerHTML += `<div><strong>${character || '❓'} ${sender}:</strong> ${msg}</div>`;
            chat.scrollTop = chat.scrollHeight;
        });

        socket.on('show_taunt', ({ playerId, card }) => {
            const avatarDiv = document.getElementById(`avatar-${playerId}`) || document.getElementById('myAvatarPosFake');
            if (!avatarDiv) return;
            const popup = document.createElement('div');
            popup.className = 'taunt-popup card ' + (card.rank==='Joker'?'joker':card.suit);
            popup.innerHTML = `<div>${card.rank}</div><div style="font-size:25px;text-align:center;">${suitIcons[card.suit]||'🃏'}</div><div></div>`;
            avatarDiv.appendChild(popup);
            setTimeout(() => { popup.remove(); }, 3000);
        });

        // LÓGICA DE CARTAS
        function drawCard(source) {
            if (!miTurno || currentPhase !== 'draw') return;
            if (source === 'discard') {
                if (document.getElementById('discardSlot').innerText.includes('Vacío')) return alert("⚠️ Pozo vacío.");
                if (selectedCards.length < 2) return alert("⚠️ Para robar del pozo debes seleccionar mínimo 2 cartas de tu mano.");
                socket.emit('pick_discard_with_meld', { roomId: currentRoomId, selectedIds: selectedCards });
                selectedCards = [];
            } else { socket.emit('draw_card', { roomId: currentRoomId, source: 'deck' }); }
        }

        function handleCardClick(cardId) {
            if (!miTurno) return;
            if (currentPhase === 'draw') {
                const idx = selectedCards.indexOf(cardId);
                if (idx > -1) selectedCards.splice(idx, 1); else selectedCards.push(cardId);
                document.querySelectorAll('.card').forEach(c => c.classList.toggle('selected', selectedCards.includes(c.id)));
            } else if (currentPhase === 'discard') {
                const idx = selectedCards.indexOf(cardId);
                if (idx > -1) { socket.emit('discard', { roomId: currentRoomId, cardId: cardId }); selectedCards = []; }
                else { selectedCards = [cardId]; document.querySelectorAll('.card').forEach(c => c.classList.toggle('selected', selectedCards.includes(c.id))); }
            }
        }

        // SISTEMA DE ENCHUFE Y DESENCHUFE INTEGRADO
        function handleGroupClick(groupId) {
            if (!miTurno || currentPhase !== 'discard') return;
            if (selectedCards.length === 1) { // Si hay carta seleccionada -> Enchufar
                socket.emit('plug_card', { roomId: currentRoomId, groupId: groupId, cardId: selectedCards[0] });
                selectedCards = [];
            }
        }

        function handleUnplug(groupId, cardId, event) {
            event.stopPropagation(); // Evitar disparar el click del grupo
            if (!miTurno || currentPhase !== 'discard') return;
            if (selectedCards.length === 0) { // Si NO hay carta seleccionada -> Desenchufar a mano
                socket.emit('unplug_card', { roomId: currentRoomId, groupId: groupId, cardId: cardId });
            }
        }

        function makeCardDraggable(el) {
            el.setAttribute('draggable', 'true');
            el.addEventListener('dragstart', () => { draggedElement = el; el.style.opacity = '0.4'; });
            el.addEventListener('dragover', (e) => {
                e.preventDefault();
                if (draggedElement && draggedElement !== el) {
                    const cards = [...document.getElementById('myHand').children];
                    if (cards.indexOf(draggedElement) < cards.indexOf(el)) el.after(draggedElement); else el.before(draggedElement);
                }
            });
            el.addEventListener('dragend', () => {
                if (draggedElement) { draggedElement.style.opacity = '1'; draggedElement = null; }
                const newOrder = [...document.getElementById('myHand').children].map(c => c.id);
                socket.emit('reorder_hand', { roomId: currentRoomId, newOrder });
            });

            el.addEventListener('touchstart', () => { draggedElement = el; el.style.opacity = '0.4'; }, { passive: true });
            el.addEventListener('touchmove', (e) => {
                if (!draggedElement) return; e.preventDefault();
                const touch = e.touches[0];
                const target = document.elementFromPoint(touch.clientX, touch.clientY)?.closest('.card');
                if (target && target !== draggedElement && target.parentElement === document.getElementById('myHand')) {
                    const cards = [...document.getElementById('myHand').children];
                    if (cards.indexOf(draggedElement) < cards.indexOf(target)) target.after(draggedElement); else target.before(draggedElement);
                }
            }, { passive: false });
            el.addEventListener('touchend', () => {
                if (draggedElement) { draggedElement.style.opacity = '1'; draggedElement = null; }
                const newOrder = [...document.getElementById('myHand').children].map(c => c.id);
                socket.emit('reorder_hand', { roomId: currentRoomId, newOrder });
            });
        }

        // Posiciones Matemáticas de Avatares
        function getSeatPosition(index, totalOthers) {
            if (totalOthers === 1) return { top: '5%', left: '50%', transform: 'translateX(-50%)' };
            if (totalOthers === 2) {
                if (index === 0) return { top: '25%', left: '10%' };
                if (index === 1) return { top: '25%', left: '90%', transform: 'translateX(-100%)' };
            }
            if (totalOthers === 3) {
                if (index === 0) return { top: '40%', left: '5%' };
                if (index === 1) return { top: '5%', left: '50%', transform: 'translateX(-50%)' };
                if (index === 2) return { top: '40%', left: '95%', transform: 'translateX(-100%)' };
            }
            if (totalOthers === 4) {
                if (index === 0) return { top: '45%', left: '5%' };
                if (index === 1) return { top: '10%', left: '25%' };
                if (index === 2) return { top: '10%', left: '75%', transform: 'translateX(-100%)' };
                if (index === 3) return { top: '45%', left: '95%', transform: 'translateX(-100%)' };
            }
            return { top: '0', left: '0' };
        }

        socket.on('room_joined', ({ roomId, isHost }) => {
            currentRoomId = roomId; soyHost = isHost;
            document.getElementById('lobby').classList.add('hidden'); document.getElementById('waitingRoom').classList.remove('hidden');
            document.getElementById('displayCode').innerText = roomId;
            if (isHost) document.getElementById('hostSettingsArea').classList.remove('hidden');
        });

        socket.on('update_lobby', (room) => {
            if (soyHost) {
                const starterSelect = document.getElementById('setStarter');
                const savedVal = starterSelect.value || room.startingPlayerId;
                starterSelect.innerHTML = '';
                room.players.forEach(p => { starterSelect.innerHTML += `<option value="${p.id}" ${p.id === savedVal ? 'selected' : ''}>${p.character || ''} ${p.name}</option>`; });
            }

            const grid = document.getElementById('charactersGrid'); grid.innerHTML = '';
            const takenChars = room.players.map(p => p.character).filter(Boolean);
            const myData = room.players.find(p => p.id === socket.id);
            miPersonaje = myData ? myData.character : null;

            characterList.forEach(char => {
                const isMySel = miPersonaje === char;
                const isTaken = takenChars.includes(char) && !isMySel;
                grid.innerHTML += `<button class="char-btn ${isMySel ? 'my-selection' : ''}" onclick="pickCharacter('${char}')" ${isTaken ? 'disabled' : ''}>${char}</button>`;
            });

            const list = document.getElementById('playerList'); list.innerHTML = '';
            let readyCount = 0;
            room.players.forEach(p => {
                if (p.ready) readyCount++;
                const isStarter = p.id === room.startingPlayerId;
                list.innerHTML += `<li>${p.character || '❓'} <strong>${p.name}</strong> ${p.id === socket.id ? '(Tú)' : ''} — ${p.ready ? '🟢 LISTO' : '❌ PENSANDO...'} ${isStarter ? '👑' : ''}</li>`;
            });

            const rBtn = document.getElementById('readyBtn');
            if(myData && myData.ready) { rBtn.innerText = "¡ESTÁS LISTO! 🟢"; rBtn.style.background = "linear-gradient(#27ae60, #2ecc71)"; }
            else { rBtn.innerText = "MARCAR LISTO"; rBtn.style.background = "linear-gradient(to bottom, #d4af37, #aa7f18)"; }

            if (soyHost && readyCount === room.players.length && room.players.length >= 2) document.getElementById('startBtn').classList.remove('hidden');
            else document.getElementById('startBtn').classList.add('hidden');
        });

        socket.on('update_hand', (hand) => {
            document.getElementById('lobby').classList.add('hidden');
            document.getElementById('waitingRoom').classList.add('hidden'); document.getElementById('victoryModal').classList.add('hidden');
            document.getElementById('gameBoard').classList.remove('hidden');
            
            const container = document.getElementById('myHand'); container.innerHTML = '';
            
            hand.forEach(c => {
                const suitClass = c.rank === 'Joker' ? 'joker' : c.suit;
                const cardDiv = document.createElement('div');
                cardDiv.className = `card ${suitClass}`; cardDiv.id = c.id;
                if(selectedCards.includes(c.id)) cardDiv.classList.add('selected');
                
                cardDiv.onclick = () => handleCardClick(c.id);
                cardDiv.innerHTML = `<div>${c.rank}</div><div style="font-size:25px; text-align:center;">${suitIcons[c.suit] || '🃏'}</div><div style="text-align:right;">${c.rank}</div>`;
                
                container.appendChild(cardDiv); makeCardDraggable(cardDiv);
            });
        });

        socket.on('update_game', (room) => {
            document.getElementById('deckCount').innerText = room.deckCount;
            currentPhase = room.phase;

            const opponents = room.players.filter(p => p.id !== socket.id);
            const myData = room.players.find(p => p.id === socket.id);
            const oppArea = document.getElementById('opponentsArea'); oppArea.innerHTML = '';

            // Dibujar a los oponentes alrededor de la mesa
            opponents.forEach((p, index) => {
                const pos = getSeatPosition(index, opponents.length);
                const isTurn = room.turnId === p.id;
                oppArea.innerHTML += `
                    <div class="avatar-seat ${isTurn ? 'active-turn' : ''}" id="avatar-${p.id}" style="top:${pos.top}; left:${pos.left}; ${pos.transform ? 'transform:'+pos.transform+';' : ''}">
                        <div class="avatar-icon">${p.surrendered ? '🪦' : (p.character || '❓')}</div>
                        <div class="avatar-name">${p.name}</div>
                        <div class="avatar-cards">🂠 x${p.cardCount}</div>
                    </div>
                `;
            });
            // Marcador invisible para tu propio Taunt
            if(!document.getElementById(`avatar-${socket.id}`)) oppArea.innerHTML += `<div id="avatar-${socket.id}" style="position:absolute; bottom:150px; left:50%; transform:translateX(-50%);"></div>`;

            const slot = document.getElementById('discardSlot');
            if(room.topDiscard) {
                const c = room.topDiscard; const sClass = c.rank==='Joker'?'joker':c.suit;
                slot.innerHTML = `<div class="card ${sClass}"><div>${c.rank}</div><div style="font-size:25px;text-align:center;">${suitIcons[c.suit] || '🃏'}</div><div></div></div>`;
            } else { slot.innerHTML = `<div class="deck-slot">Vacío</div>`; }

            const area = document.getElementById('exposedArea'); area.innerHTML = '';
            room.exposedGroups.forEach(g => {
                let cardsHTML = '';
                g.cards.forEach(c => { 
                    cardsHTML += `<span onclick="handleUnplug('${g.id}', '${c.id}', event)" style="background:white; color:${(c.suit==='hearts'||c.suit==='diamonds')?'#c0392b':'black'}; padding:2px 5px; border-radius:3px; font-weight:bold; font-size:12px; margin:0 2px; cursor:pointer;">${c.rank}${suitIcons[c.suit] || '🃏'}</span>`; 
                });
                area.innerHTML += `<div class="exposed-group" onclick="handleGroupClick('${g.id}')"><div><small style="color:#f1c40f;">${g.ownerName}:</small> </div>${cardsHTML}</div>`;
            });

            if (room.turnId === socket.id) {
                miTurno = true;
                if (currentPhase === 'draw') {
                    document.getElementById('turnIndicator').innerText = "🔴 TU TURNO: Roba carta de la mesa.";
                    document.getElementById('helperText').innerText = "Toca el MAZO o selecciona grupos y toca el DESCARTE.";
                } else if (currentPhase === 'discard') {
                    document.getElementById('turnIndicator').innerText = "🔵 TU TURNO: Baja juegos o Descarta.";
                    document.getElementById('helperText').innerText = "Un toque para ENCHUFAR. Si NO seleccionas carta, tocas mesa para DESENCHUFAR.";
                }
            } else {
                miTurno = false;
                const active = room.players.find(p => p.id === room.turnId);
                document.getElementById('turnIndicator').innerText = `Pensando: ${active ? active.name : 'oponente'}...`;
                document.getElementById('helperText').innerText = "Analizando el tablero...";
            }
        });

        socket.on('returned_to_lobby', (room) => {
            if (!room) { document.getElementById('gameBoard').classList.add('hidden'); document.getElementById('victoryModal').classList.add('hidden'); document.getElementById('lobby').classList.remove('hidden'); return; }
            document.getElementById('gameBoard').classList.add('hidden'); document.getElementById('victoryModal').classList.add('hidden'); document.getElementById('waitingRoom').classList.remove('hidden'); selectedCards = [];
        });

        socket.on('game_over', ({ scores, knocker, winner, wasVolteado }) => {
            document.getElementById('knockerName').innerText = knocker === 'Mesa Cerrada' ? 'Ronda finalizada (Mesa cerrada)' : `Cierre por: ${knocker}`;
            const titleAlert = document.getElementById('victoryAlert');
            if(wasVolteado) titleAlert.innerHTML = `🔥 ¡VOLTEADA COMPLETA! 🔥<br><span style="font-size:14px; color:#f1c40f;">${winner} acomodó mejor sus cartas</span>`;
            else titleAlert.innerText = `🏆 ¡Ganador: ${winner}! 🏆`;

            const tbody = document.getElementById('modalScoreBody'); tbody.innerHTML = '';
            scores.forEach(s => {
                const isWinner = s.name === winner;
                let handHTML = '<div style="margin-top: 4px;">';
                s.finalHand.forEach(c => {
                    let col = (c.suit === 'hearts' || c.suit === 'diamonds') ? '#c0392b' : ((c.rank === 'Joker') ? '#8e44ad' : '#ecf0f1');
                    handHTML += `<span style="display:inline-block; background:rgba(0,0,0,0.5); border:1px solid ${col}; color:${col}; padding:2px 4px; border-radius:4px; font-size:11px; font-weight:bold; margin-right:2px;">${c.rank}${suitIcons[c.suit] || '🃏'}</span>`;
                });
                handHTML += '</div>';

                tbody.innerHTML += `
                    <tr style="border-bottom: 1px solid #5c3a21; background: ${isWinner ? 'rgba(241,196,15,0.2)' : 'transparent'};">
                        <td style="text-align: left; padding: 8px;">
                            <strong>${s.character || '❓'} ${s.name}</strong> ${isWinner ? '👑' : ''}
                            ${handHTML}
                        </td>
                        <td style="vertical-align: middle; font-size: 16px; color:#f1c40f;"><strong>${s.score}</strong> pts</td>
                    </tr>
                `;
            });
            document.getElementById('victoryModal').classList.remove('hidden');
        });

        socket.on('error_msg', (msg) => alert(msg));
    </script>
</body>
</html>
